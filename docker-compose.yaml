version: "3.9"
services:
  # backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ./server:/app # overrides /app from COPY in Dockerfile
      - jobapplication_server_node_modules:/app/node_modules # create docker volume

  # frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    expose:
      - "5000"
    volumes:
      - ./client:/app
      - jobapplication_client_node_modules:/app/node_modules

  # qdrant
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - jobapplication_qdrant:/qdrant/storage
      
  # python
  python:
    build:
      context: ./python_app
      dockerfile: Dockerfile
      network: host
    expose:
      - "8080"
      - "5900"
    volumes:
      - ./python_app:/app
      - ./python_app/model_cache:/tmp/fastembed_cache

  # nginx
  nginx:
    image: nginx
    ports:
      - "5000:5000"
      - "6333:6333"
      - "8080:8080"
      - "5900:5900"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    
volumes:
  jobapplication_qdrant:
    external: true
  jobapplication_server_node_modules:
    external: true
  jobapplication_client_node_modules:
    external: true